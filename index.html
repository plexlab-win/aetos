<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AETOS RESORTS — Select Your Stay</title>
    
    <meta name="description" content="고요와 비움의 미학을 담은 프리미엄 리조트 에이토스. 해안 절벽의 프라이빗 풀빌라 '에이토스 하우스'와 숲속의 지열 온천 웰니스 '그랜드 에이토스' 중 당신만의 안식처를 선택해 보세요.">
    
    <!-- Google Fonts: Playfair Display (editorial luxury serif), Noto Serif KR, Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif+KR:wght@200;300;400;500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --color-gold: #c5a880;
            --color-gold-hover: #b0936c;
            --color-obsidian: #111111;
            --color-pearl: #faf8f5;
            --font-serif: 'Playfair Display', 'Noto Serif KR', serif;
            --font-sans: 'Inter', sans-serif;
            --transition-smooth: all 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            overflow: hidden;
            font-family: var(--font-sans);
            background-color: var(--color-obsidian);
            color: var(--color-pearl);
            -webkit-font-smoothing: antialiased;
        }

        /* Portal Split Screen Container */
        .portal-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        /* Portal Panels */
        .portal-panel {
            flex: 1;
            height: 100%;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 3rem;
            transition: var(--transition-smooth);
            text-decoration: none;
            color: var(--color-pearl);
        }

        /* Background image containers with zoom */
        .panel-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: var(--transition-smooth);
            transform: scale(1.03);
            z-index: 1;
        }

        .panel-left .panel-bg {
            background-image: linear-gradient(rgba(17, 17, 17, 0.4), rgba(17, 17, 17, 0.75)), url('assets/hero.png');
        }

        .panel-right .panel-bg {
            background-image: linear-gradient(rgba(17, 17, 17, 0.4), rgba(17, 17, 17, 0.75)), url('assets/spa.png');
            border-left: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Hover Interactions */
        .portal-panel:hover {
            flex: 1.15;
        }

        .portal-panel:hover .panel-bg {
            transform: scale(1.08);
            filter: brightness(1.1);
        }

        /* Panel content */
        .panel-content {
            position: relative;
            z-index: 2;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        .panel-tagline {
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.35em;
            color: var(--color-gold);
            text-transform: uppercase;
        }

        .panel-title {
            font-family: var(--font-serif);
            font-size: 3rem;
            font-weight: 300;
            letter-spacing: 0.15em;
            line-height: 1.2;
            margin-bottom: 0.5rem;
        }

        .panel-desc {
            font-size: 0.85rem;
            font-weight: 300;
            line-height: 1.8;
            color: rgba(250, 248, 245, 0.7);
            margin-bottom: 1.5rem;
            word-break: keep-all;
        }

        /* Minimalist Button link */
        .btn-portal {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.9rem 2.2rem;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            border: 1px solid rgba(250, 248, 245, 0.25);
            color: var(--color-pearl);
            background: transparent;
            transition: all 0.4s ease;
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        .btn-portal::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background-color: var(--color-pearl);
            z-index: -1;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .portal-panel:hover .btn-portal {
            border-color: var(--color-pearl);
        }

        .btn-portal:hover {
            color: var(--color-obsidian);
            border-color: var(--color-pearl);
        }

        .btn-portal:hover::before {
            transform: translateX(100%);
        }

        /* Center Insignia Brand */
        .portal-insignia {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .insignia-circle {
            width: 90px;
            height: 90px;
            border: 1px solid rgba(197, 168, 128, 0.2);
            background-color: rgba(17, 17, 17, 0.85);
            border-radius: 50%;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-serif);
            font-size: 1.1rem;
            font-weight: 300;
            color: var(--color-gold);
            letter-spacing: 0.2em;
            padding-left: 2px; /* Visual balance */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: var(--transition-smooth);
        }

        .portal-container:hover .insignia-circle {
            border-color: var(--color-gold);
            transform: scale(1.05);
        }

        /* Header logo/brand on top left */
        .portal-header {
            position: absolute;
            top: 3rem;
            left: 3.5rem;
            z-index: 20;
            pointer-events: none;
        }

        .portal-logo {
            font-family: var(--font-serif);
            font-size: 1.4rem;
            font-weight: 300;
            letter-spacing: 0.2em;
            color: var(--color-pearl);
        }

        /* Mobile responsive adjustments */
        @media (max-width: 768px) {
            .portal-container {
                flex-direction: column;
            }

            .portal-panel {
                width: 100%;
                height: 50vh;
                padding: 2rem;
            }

            .panel-right .panel-bg {
                border-left: none;
                border-top: 1px solid rgba(255, 255, 255, 0.05);
            }

            .portal-panel:hover {
                flex: 1.1;
            }

            .panel-title {
                font-size: 2.2rem;
            }

            .panel-desc {
                font-size: 0.8rem;
                margin-bottom: 1rem;
            }

            .portal-insignia {
                display: none; /* Hide insignia on mobile to avoid clutter */
            }

            .portal-header {
                top: 2rem;
                left: 50%;
                transform: translateX(-50%);
                text-align: center;
            }
        }

        /* Custom Cursor */
        @media (min-width: 1025px) {
            body {
                cursor: none;
            }
            a, .portal-panel {
                cursor: none !important;
            }
            
            .custom-cursor {
                position: fixed;
                top: 0;
                left: 0;
                width: 32px;
                height: 32px;
                border: 1px solid var(--color-gold);
                border-radius: 50%;
                pointer-events: none;
                z-index: 9999;
                transform: translate(-50%, -50%);
                transition: width 0.3s ease, height 0.3s ease, background-color 0.3s ease, border-color 0.3s ease;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            
            .custom-cursor-dot {
                position: fixed;
                top: 0;
                left: 0;
                width: 4px;
                height: 4px;
                background-color: var(--color-gold);
                border-radius: 50%;
                pointer-events: none;
                z-index: 10000;
                transform: translate(-50%, -50%);
                transition: transform 0.1s ease;
            }
            
            .custom-cursor.hover {
                width: 55px;
                height: 55px;
                background-color: rgba(197, 168, 128, 0.08);
                border-color: var(--color-gold);
            }
            
            .custom-cursor.view-hover {
                width: 85px;
                height: 85px;
                background-color: rgba(17, 17, 17, 0.9);
                border-color: var(--color-gold);
            }
            
            .custom-cursor::after {
                content: '';
                font-family: var(--font-sans);
                font-size: 0.55rem;
                font-weight: 700;
                letter-spacing: 0.15em;
                color: var(--color-gold);
                text-transform: uppercase;
                opacity: 0;
                transition: opacity 0.25s ease;
                white-space: nowrap;
            }
            
            .custom-cursor.view-hover::after {
                content: 'ENTER';
                opacity: 1;
            }
        }

        @media (max-width: 1024px) {
            .custom-cursor, .custom-cursor-dot {
                display: none !important;
            }
        }
    </style>
</head>
<body>

    <!-- Small Header Logo overlay -->
    <header class="portal-header">
        <h1 class="portal-logo">AETOS RESORTS</h1>
    </header>

    <!-- Split screens -->
    <div class="portal-container">
        
        <!-- Left Panel: Oceanfront Pool Villa (Aetos House) -->
        <a href="pool-villa.html" class="portal-panel panel-left">
            <div class="panel-bg"></div>
            <div class="panel-content">
                <span class="panel-tagline">OCEANFRONT STAY</span>
                <h2 class="panel-title">AETOS HOUSE</h2>
                <p class="panel-desc">
                    바다와 절벽, 그 사이 완벽한 고요를 담은 시크릿 풀빌라.<br>개별 온수 인피니티 풀에서 온전한 해방감을 경험해 보세요.
                </p>
                <div class="btn-portal">Enter Stay</div>
            </div>
        </a>

        <!-- Center Circle Insignia -->
        <div class="portal-insignia">
            <div class="insignia-circle">A</div>
        </div>

        <!-- Right Panel: Forest Retreat & Spa (Grand Aetos) -->
        <a href="forest-retreat/index.html" class="portal-panel panel-right">
            <div class="panel-bg"></div>
            <div class="panel-content">
                <span class="panel-tagline">FOREST RETREAT</span>
                <h2 class="panel-title">GRAND AETOS</h2>
                <p class="panel-desc">
                    태고의 소나무 숲속에서 누리는 지열 천연 온천과 리추얼 스파.<br>몸과 영혼의 대칭을 이루는 최고의 웰니스 여정.
                </p>
                <div class="btn-portal">Enter Sanctuary</div>
            </div>
        </a>

    </div>

    <!-- Custom Mouse Cursor -->
    <div class="custom-cursor" id="custom-cursor"></div>
    <div class="custom-cursor-dot" id="custom-cursor-dot"></div>

    <!-- JavaScript for Custom Cursor Tracker -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const cursor = document.getElementById("custom-cursor");
            const cursorDot = document.getElementById("custom-cursor-dot");
            
            if (cursor && cursorDot) {
                let mouseX = 0;
                let mouseY = 0;
                let cursorX = 0;
                let cursorY = 0;
                
                window.addEventListener("mousemove", (e) => {
                    mouseX = e.clientX;
                    mouseY = e.clientY;
                    
                    cursorDot.style.left = `${mouseX}px`;
                    cursorDot.style.top = `${mouseY}px`;
                });
                
                const tick = () => {
                    cursorX += (mouseX - cursorX) * 0.12;
                    cursorY += (mouseY - cursorY) * 0.12;
                    
                    cursor.style.left = `${cursorX}px`;
                    cursor.style.top = `${cursorY}px`;
                    
                    requestAnimationFrame(tick);
                };
                tick();
                
                // Hover effects for portal panels
                const panels = document.querySelectorAll(".portal-panel");
                panels.forEach(panel => {
                    panel.addEventListener("mouseenter", () => {
                        cursor.classList.add("view-hover");
                    });
                    panel.addEventListener("mouseleave", () => {
                        cursor.classList.remove("view-hover");
                    });
                });

                // Hover effects for standard links/buttons if any
                const hoverables = document.querySelectorAll("a, button");
                hoverables.forEach(el => {
                    if (!el.classList.contains("portal-panel")) {
                        el.addEventListener("mouseenter", () => {
                            cursor.classList.add("hover");
                        });
                        el.addEventListener("mouseleave", () => {
                            cursor.classList.remove("hover");
                        });
                    }
                });
            }
        });
    </script>

</body>
</html>
